name: 打包发布 - Windows & macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Windows：onedir + ZIP
  # ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install Pillow PyQt5 pyinstaller onnxruntime numpy
        shell: pwsh

      - name: 下载 modnet.onnx 模型
        run: |
          $urls = @(
            "https://github.com/ZHKKKe/MODNet/releases/download/v1.0/modnet_photographic_portrait_matting.onnx",
            "https://huggingface.co/onnx-community/modnet-webnn/resolve/main/onnx/model.onnx"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              Write-Host "尝试下载: $url"
              Invoke-WebRequest -Uri $url -OutFile "modnet.onnx" -TimeoutSec 180
              $ok = $true
              break
            } catch {
              Write-Host "失败，尝试下一个..."
            }
          }
          if (-not $ok) { throw "所有下载地址均失败" }
          Write-Host "模型大小: $([math]::Round((Get-Item modnet.onnx).length / 1MB, 1)) MB"
        shell: pwsh

      - name: 打包为目录（onedir）
        run: |
          pyinstaller main.py `
            --name "ZJZPhoto" `
            --windowed `
            --onedir `
            --icon "icon.ico" `
            --add-data "modnet.onnx;." `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --hidden-import layout_engine `
            --hidden-import u2net_engine `
            --hidden-import utils `
            --hidden-import module_id_photo `
            --hidden-import module_perspective `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import PIL.ImageFilter `
            --hidden-import PyQt5 `
            --hidden-import PyQt5.QtWidgets `
            --hidden-import PyQt5.QtCore `
            --hidden-import PyQt5.QtGui `
            --hidden-import onnxruntime `
            --hidden-import numpy `
            --clean --noconfirm
          Write-Host "✓ onedir 打包完成"
        shell: pwsh

      - name: 打包为 ZIP
        run: |
          Compress-Archive -Path "dist/ZJZPhoto/*" -DestinationPath "IDPhotoTool-Windows.zip"
          Write-Host "✓ ZIP 大小: $([math]::Round((Get-Item IDPhotoTool-Windows.zip).length / 1MB, 1)) MB"
        shell: pwsh

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: IDPhotoTool-Windows.zip

  # ─────────────────────────────────────────
  # macOS：打包为 .app 再制作 .dmg
  # ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install Pillow PyQt5 pyinstaller onnxruntime numpy
          brew install create-dmg

      - name: 下载 modnet.onnx 模型
        run: |
          curl -L --retry 3 --retry-delay 5 \
            "https://github.com/ZHKKKe/MODNet/releases/download/v1.0/modnet_photographic_portrait_matting.onnx" \
            -o modnet.onnx 2>/dev/null \
          || curl -L --retry 3 --retry-delay 5 \
            "https://huggingface.co/onnx-community/modnet-webnn/resolve/main/onnx/model.onnx" \
            -o modnet.onnx
          echo "模型大小: $(du -sh modnet.onnx)"

      - name: 将 icon.png 转换为 icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o icon.icns
          echo "✓ icon.icns 生成完成"

      - name: 创建 entitlements.plist
        run: |
          cat > entitlements.plist << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
          </dict>
          </plist>
          ENTEOF
          echo "✓ entitlements.plist 创建完成"

      - name: 打包为 .app（--collect-all PyQt5 确保插件完整）
        run: |
          pyinstaller main.py \
            --name "证件照便捷工具" \
            --windowed \
            --onedir \
            --icon "icon.icns" \
            --add-data "modnet.onnx:." \
            --add-data "icon.icns:." \
            --add-data "icon.png:." \
            --hidden-import layout_engine \
            --hidden-import u2net_engine \
            --hidden-import utils \
            --hidden-import module_id_photo \
            --hidden-import module_perspective \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import PIL.ImageFilter \
            --hidden-import PyQt5 \
            --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import onnxruntime \
            --hidden-import numpy \
            --collect-all PyQt5 \
            --clean --noconfirm
          echo "✓ PyInstaller 打包完成"

      - name: 修复 Info.plist（补全必要键值）
        run: |
          PLIST="dist/证件照便捷工具.app/Contents/Info.plist"

          set_or_add() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :$1 $3 $2" "$PLIST"
          }

          set_or_add "CFBundleIdentifier"     "com.zjzphoto.idphototool" "string"
          set_or_add "CFBundleDisplayName"    "证件照便捷工具"            "string"
          set_or_add "CFBundleName"           "证件照便捷工具"            "string"
          set_or_add "NSHighResolutionCapable" "true"                    "bool"
          set_or_add "NSPrincipalClass"        "NSApplication"           "string"
          set_or_add "LSMinimumSystemVersion"  "10.15"                   "string"

          echo "✓ Info.plist 修复完成"

      - name: 代码签名（ad-hoc，解决 Gatekeeper 拦截）
        run: |
          APP="dist/证件照便捷工具.app"

          # 移除隔离属性
          xattr -cr "$APP"

          # 逐一签名所有动态库（比 --deep 更可靠）
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
            codesign --force --sign "-" "$f" 2>/dev/null || true
          done

          # 签名可执行文件
          find "$APP/Contents/MacOS" -type f | while read f; do
            codesign --force --sign "-" "$f" 2>/dev/null || true
          done

          # 最终签名整个 .app（带 entitlements）
          codesign --force --deep --sign "-" \
            --entitlements entitlements.plist \
            "$APP"

          echo "✓ 签名完成"
          codesign --verify --verbose "$APP" && echo "✓ 签名验证通过" || true

          # 再次清除 quarantine
          xattr -cr "$APP"

      - name: 制作 .dmg 安装包
        run: |
          mkdir -p dmg_staging
          cp -r "dist/证件照便捷工具.app" dmg_staging/
          create-dmg \
            --volname "证件照便捷工具" \
            --volicon "icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "证件照便捷工具.app" 175 190 \
            --hide-extension "证件照便捷工具.app" \
            --app-drop-link 425 190 \
            "IDPhotoTool-macOS.dmg" \
            dmg_staging/ \
          || \
          create-dmg \
            --volname "证件照便捷工具" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "证件照便捷工具.app" 175 190 \
            --hide-extension "证件照便捷工具.app" \
            --app-drop-link 425 190 \
            "IDPhotoTool-macOS.dmg" \
            dmg_staging/

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: IDPhotoTool-macOS.dmg

  # ─────────────────────────────────────────
  # 发布 Release
  # ─────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: 列出产物
        run: ls -lh artifacts/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 证件照便捷工具 ${{ github.ref_name }}
          body: |
            ## 证件照便捷工具 ${{ github.ref_name }}

            ### 下载安装
            | 系统 | 文件 | 说明 |
            |------|------|------|
            | **Windows** | `IDPhotoTool-Windows.zip` | 解压后双击 `ZJZPhoto.exe` 运行，无需安装 |
            | **macOS** | `IDPhotoTool-macOS.dmg` | 打开后将「证件照便捷工具」拖入 Applications |

            ### macOS 首次打开说明
            1. 打开 DMG，将「证件照便捷工具」拖入「应用程序」文件夹
            2. **首次打开**：右键点击图标 → 选择「打开」→ 点击「打开」按钮
            3. 之后可以直接双击打开

            ### 功能
            - AI 抠图换背景（MODNet Matting，发丝软边，完全离线）
            - 7 种排版模板（一寸/二寸/小二寸/三寸/驾驶证/一寸+二寸/结婚照）
            - PS 风格裁剪框
            - 画笔修复工具（支持撤销 Cmd+Z / Ctrl+Z）
            - 300 DPI 导出
            - 透视矫正工具

            > 完全本地运行，不联网，不上传任何图片
          files: |
            artifacts/IDPhotoTool-Windows.zip
            artifacts/IDPhotoTool-macOS.dmg
          draft: false
          prerelease: false
