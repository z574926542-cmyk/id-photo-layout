name: 打包发布 - Windows & macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Windows：onedir + 7-Zip SFX 自解压安装包
  # ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install Pillow PyQt5 pyinstaller onnxruntime numpy
        shell: pwsh

      - name: 下载 rmbg.onnx 模型
        run: |
          $url = "https://huggingface.co/briaai/RMBG-1.4/resolve/main/onnx/model.onnx"
          Invoke-WebRequest -Uri $url -OutFile "rmbg.onnx"
          Write-Host "模型大小: $([math]::Round((Get-Item rmbg.onnx).length / 1MB, 1)) MB"
        shell: pwsh

      - name: 打包为目录（onedir，避免 onefile 解压损坏）
        run: |
          pyinstaller main.py `
            --name "ZJZPhoto" `
            --windowed `
            --onedir `
            --icon "icon.ico" `
            --add-data "rmbg.onnx;." `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --hidden-import layout_engine `
            --hidden-import u2net_engine `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import PIL.ImageFilter `
            --hidden-import PyQt5 `
            --hidden-import PyQt5.QtWidgets `
            --hidden-import PyQt5.QtCore `
            --hidden-import PyQt5.QtGui `
            --hidden-import onnxruntime `
            --hidden-import numpy `
            --clean --noconfirm
          Write-Host "✓ onedir 打包完成"
          Get-ChildItem dist/ZJZPhoto/ | Select-Object Name, Length
        shell: pwsh

      - name: 用 7-Zip 打包为 ZIP（Windows 安装包）
        run: |
          # 将 dist/IDPhotoTool 目录压缩为 zip
          Compress-Archive -Path "dist/ZJZPhoto/*" -DestinationPath "IDPhotoTool-Windows.zip"
          Write-Host "✓ ZIP 大小: $([math]::Round((Get-Item IDPhotoTool-Windows.zip).length / 1MB, 1)) MB"
        shell: pwsh

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: IDPhotoTool-Windows.zip

  # ─────────────────────────────────────────
  # macOS：打包为 .app 再制作 .dmg
  # ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install Pillow PyQt5 pyinstaller onnxruntime numpy
          brew install create-dmg

      - name: 下载 rmbg.onnx 模型
        run: |
          curl -L "https://huggingface.co/briaai/RMBG-1.4/resolve/main/onnx/model.onnx" -o rmbg.onnx
          echo "模型大小: $(du -sh rmbg.onnx)"

      - name: 将 icon.png 转换为 icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o icon.icns
          echo "✓ icon.icns 生成完成"

      - name: 打包为 .app 并设置中文名称
        run: |
          # 先用英文名打包（避免文件系统兼容性问题）
          pyinstaller main.py \
            --name "证件照便捷工具" \
            --windowed \
            --onedir \
            --icon "icon.icns" \
            --add-data "rmbg.onnx:." \
            --add-data "icon.icns:." \
            --add-data "icon.png:." \
            --hidden-import layout_engine \
            --hidden-import u2net_engine \
            --hidden-import utils \
            --hidden-import module_id_photo \
            --hidden-import module_perspective \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import PIL.ImageFilter \
            --hidden-import PyQt5 \
            --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import onnxruntime \
            --hidden-import numpy \
            --clean --noconfirm

          # 修改 Info.plist：设置 CFBundleDisplayName 和 CFBundleName 为中文
          PLIST="dist/证件照便捷工具.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 证件照便捷工具" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 证件照便捷工具" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 证件照便捷工具" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string 证件照便捷工具" "$PLIST"


          # ── 关键：ad-hoc 代码签名，解决 macOS Gatekeeper「已损坏」问题 ──
          # 对整个 .app 做深度签名（--deep 递归签名所有二进制文件）
          # 使用 "-" 表示 ad-hoc 签名，不需要 Apple 开发者证书
          codesign --force --deep --sign "-" "dist/证件照便捷工具.app"
          echo "✓ ad-hoc 签名完成"
          codesign --verify --verbose "dist/证件照便捷工具.app" && echo "✓ 签名验证通过"

          # 移除 quarantine 隔离属性（防止 Gatekeeper 二次拦截）
          xattr -cr "dist/证件照便捷工具.app"

          echo "✓ 应用名称已设置"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "dist/证件照便捷工具.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "dist/证件照便捷工具.app/Contents/Info.plist"

      - name: 制作 .dmg 安装包
        run: |
          mkdir -p dmg_staging
          cp -r "dist/证件照便捷工具.app" dmg_staging/
          create-dmg \
            --volname "证件照便捷工具" \
            --volicon "icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "证件照便捷工具.app" 175 190 \
            --hide-extension "证件照便捷工具.app" \
            --app-drop-link 425 190 \
            "IDPhotoTool-macOS.dmg" \
            dmg_staging/ \
          || \
          create-dmg \
            --volname "证件照便捷工具" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "证件照便捷工具.app" 175 190 \
            --hide-extension "证件照便捷工具.app" \
            --app-drop-link 425 190 \
            "IDPhotoTool-macOS.dmg" \
            dmg_staging/

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: IDPhotoTool-macOS.dmg

  # ─────────────────────────────────────────
  # 发布 Release
  # ─────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: 列出产物
        run: ls -lh artifacts/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 证件照便捷工具 ${{ github.ref_name }}
          body: |
            ## 证件照便捷工具 ${{ github.ref_name }}

            ### 下载安装
            | 系统 | 文件 | 说明 |
            |------|------|------|
            | **Windows** | `IDPhotoTool-Windows.zip` | 解压后双击 `ZJZPhoto.exe` 运行，无需安装 |
            | **macOS** | `IDPhotoTool-macOS.dmg` | 打开后将「证件照便捷工具」拖入 Applications |

            ### 功能
            - AI 抠图换背景（RMBG-1.4，完全离线）
            - 7 种排版模板（一寸/二寸/小二寸/三寸/驾驶证/一寸+二寸/结婚照）
            - PS 风格裁剪框
            - 画笔修复工具
            - 300 DPI 导出

            > 完全本地运行，不联网，不上传任何图片
          files: |
            artifacts/IDPhotoTool-Windows.zip
            artifacts/IDPhotoTool-macOS.dmg
          draft: false
          prerelease: false
